<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Survey System</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:30px 15px}
.box{max-width:500px;margin:auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
h1{margin-top:0}
input,button,select{width:100%;padding:11px;margin-top:8px;margin-bottom:12px;box-sizing:border-box;border-radius:8px;border:1px solid #ccc}
button{background:#111827;color:#fff;border:0;cursor:pointer;font-weight:bold}
.status{padding:10px;background:#eef2ff;border-radius:8px;margin-bottom:15px;font-size:14px}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
#app{display:none}
</style>
</head>
<body>
<div class="box">
<h1>🗳️ Database Survey System</h1>
<div id="status" class="status">Belum login.</div>

<div id="loginBox">
<label>Username</label>
<input id="username">
<label>Password</label>
<input id="password" type="password">
<button onclick="login()">Log Masuk</button>
</div>

<div id="app">
<h3>API Connected ✅</h3>
<p>User: <strong id="userInfo"></strong></p>

<label>DM</label>
<select id="dmSelect" onchange="loadLocalities()">
<option value="">Pilih DM</option>
</select>

<label>Lokaliti</label>
<select id="localitySelect">
<option value="">Pilih Lokaliti</option>
</select>

<button onclick="testVoters()">Test Carian Pemilih</button>
<button onclick="logout()">Logout</button>
<div id="result"></div>
</div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycby6Df6Wh78LVAXLMp-lzOk7S0794xSWtr1_YJMjB8L76yFsgePs35-tBcJt8RVYAwNY/exec';
let loginToken=localStorage.getItem('survey_token')||'';

function api(action,params={}){
return new Promise((resolve,reject)=>{
const callback='apiCallback_'+Date.now()+'_'+Math.floor(Math.random()*10000);
const script=document.createElement('script');
const query=new URLSearchParams({action,callback,...params});
window[callback]=function(data){delete window[callback];script.remove();resolve(data)};
script.onerror=function(){delete window[callback];script.remove();reject(new Error('Gagal sambung API.'))};
script.src=API_URL+'?'+query.toString();
document.body.appendChild(script);
});
}

function login(){
const username=document.getElementById('username').value.trim();
const password=document.getElementById('password').value;
if(!username||!password){showStatus('Username dan password diperlukan.','error');return}
showStatus('Sedang login...');
api('login',{username,password}).then(result=>{
if(!result.success){showStatus(result.message||'Login gagal.','error');return}
loginToken=result.token;
localStorage.setItem('survey_token',loginToken);
document.getElementById('userInfo').textContent=result.username+' ('+result.role+')';
document.getElementById('loginBox').style.display='none';
document.getElementById('app').style.display='block';
showStatus('Login API berjaya.','success');
loadDMs();
}).catch(error=>showStatus(error.message,'error'));
}

async function loadDMs(){
try{
const result=await api('dms',{token:loginToken});
if(!result.success)throw new Error(result.message);
const select=document.getElementById('dmSelect');
select.innerHTML='<option value="">Pilih DM</option>';
(result.data||[]).forEach(dm=>{
const option=document.createElement('option');
option.value=dm.kodDM;
option.textContent=dm.kodDM+' - '+dm.namaDM;
select.appendChild(option);
});
}catch(error){showStatus(error.message,'error')}
}

async function loadLocalities(){
const kodDM=document.getElementById('dmSelect').value;
const select=document.getElementById('localitySelect');
select.innerHTML='<option value="">Pilih Lokaliti</option>';
if(!kodDM)return;
try{
const result=await api('localities',{token:loginToken,kodDM});
if(!result.success)throw new Error(result.message);
(result.data||[]).forEach(locality=>{
const option=document.createElement('option');
option.value=locality.namaLokaliti;
option.textContent=locality.kodLokaliti+' - '+locality.namaLokaliti;
select.appendChild(option);
});
}catch(error){showStatus(error.message,'error')}
}

async function testVoters(){
const filters={
kodDM:document.getElementById('dmSelect').value,
namaLokaliti:document.getElementById('localitySelect').value,
umurDari:'',
umurHingga:'',
jantina:'',
bangsa:'',
kodCula:''
};
try{
const result=await api('voters',{token:loginToken,filters:JSON.stringify(filters)});
if(!result.success)throw new Error(result.message);
document.getElementById('result').innerHTML='<hr><strong>Jumlah Pemilih: '+(result.data||[]).length+'</strong>';
}catch(error){showStatus(error.message,'error')}
}

async function logout(){
try{await api('logout',{token:loginToken})}catch(error){}
localStorage.removeItem('survey_token');
location.reload();
}

function showStatus(message,type=''){
const box=document.getElementById('status');
box.textContent=message;
box.className='status '+type;
}

async function restoreSession(){
if(!loginToken)return;
try{
const result=await api('session',{token:loginToken});
if(!result.loggedIn){localStorage.removeItem('survey_token');loginToken='';return}
document.getElementById('loginBox').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('userInfo').textContent=result.username+' ('+result.role+')';
loadDMs();
}catch(error){console.error(error)}
}
restoreSession();
</script>
</body>
</html>
