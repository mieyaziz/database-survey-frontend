<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family: Arial, sans-serif;

      background: #f8fafc;

      color: #111827;

    }


    .login-card {

      width: 100%;

      max-width: 390px;

      margin: 20px;

      padding: 30px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 10px 35px
        rgba(15, 23, 42, .10);

      border: 1px solid #eef2f7;

    }


    .login-icon {

      width: 64px;

      height: 64px;

      margin: 0 auto 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 18px;

      background: #111827;

      color: white;

      font-size: 28px;

    }


    .login-title {

      text-align: center;

      font-size: 24px;

      font-weight: 900;

      margin-bottom: 7px;

    }


    .login-subtitle {

      text-align: center;

      font-size: 13px;

      color: #64748b;

      margin-bottom: 25px;

    }


    .field {

      margin-bottom: 16px;

    }


    .field label {

      display: block;

      margin-bottom: 7px;

      font-size: 12px;

      font-weight: 800;

      color: #475569;

    }


    .field input {

      width: 100%;

      height: 46px;

      padding: 0 13px;

      border: 1px solid #d1d5db;

      border-radius: 11px;

      outline: none;

      font-size: 14px;

    }


    .field input:focus {

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);

    }


    .login-button {

      width: 100%;

      height: 46px;

      border: none;

      border-radius: 11px;

      background: #111827;

      color: white;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

    }


    .login-button:hover {

      opacity: .9;

    }


    .login-button:disabled {

      opacity: .55;

      cursor: not-allowed;

    }


    .login-message {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      font-weight: 700;

      color: #dc2626;

    }

  </style>

</head>


<body>


  <div class="login-card">


    <div class="login-icon">

      🔐

    </div>


    <div class="login-title">

      Log Masuk

    </div>


    <div class="login-subtitle">

      Sistem Pengurusan Pemilih

    </div>


    <div class="field">

      <label>

        USERNAME

      </label>

      <input
        type="text"
        id="username"
        autocomplete="username"
        placeholder="Masukkan username">

    </div>


    <div class="field">

      <label>

        PASSWORD

      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Masukkan password">

    </div>


    <button
      type="button"
      class="login-button"
      id="loginButton"
      onclick="login()">

      🔐 Log Masuk

    </button>


    <div
      id="loginMessage"
      class="login-message">
    </div>


  </div>


<script>

const GITHUB_API_URL =
  'https://script.google.com/macros/s/AKfycby6Df6Wh78LVAXLMp-lzOk7S0794xSWtr1_YJMjB8L76yFsgePs35-tBcJt8RVYAwNY/exec';

const GITHUB_PAGES_URL =
  'https://mieyaziz.github.io/database-survey-frontend/';

function githubLoginRequest_(username, password, success, failure) {

  const callbackName =
    '__loginApiCallback_' +
    Date.now() +
    '_' +
    Math.random().toString(36).slice(2);

  const script =
    document.createElement('script');

  let finished = false;

  const timeoutId =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      try {
        delete window[callbackName];
      } catch (e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      if (typeof failure === 'function') {
        failure(
          new Error(
            'API timeout: Apps Script tidak memberi respons.'
          )
        );
      }

    }, 30000);

  function cleanup() {

    if (finished) return;

    finished = true;

    clearTimeout(timeoutId);

    try {
      delete window[callbackName];
    } catch (e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }

  window[callbackName] =
    function(response) {

      if (finished) return;

      cleanup();

      if (
        !response ||
        response.success === false
      ) {

        if (typeof failure === 'function') {

          failure(
            new Error(
              response &&
              response.message
                ? response.message
                : 'Login gagal.'
            )
          );

        }

        return;

      }

      if (typeof success === 'function') {
        success(response);
      }

    };

  script.onerror =
    function() {

      if (finished) return;

      cleanup();

      if (typeof failure === 'function') {

        failure(
          new Error(
            'Gagal menghubungi Apps Script API.'
          )
        );

      }

    };

  const query =
    new URLSearchParams();

  query.set(
    'action',
    'login'
  );

  query.set(
    'username',
    username
  );

  query.set(
    'password',
    password
  );

  query.set(
    'callback',
    callbackName
  );

  script.src =
    GITHUB_API_URL +
    '?' +
    query.toString();

  document.body.appendChild(
    script
  );

}


function login() {

  const username =
    document.getElementById('username')
      .value
      .trim();

  const password =
    document.getElementById('password')
      .value;

  const button =
    document.getElementById('loginButton');

  const message =
    document.getElementById('loginMessage');


  message.textContent = '';


  if (!username || !password) {

    message.textContent =
      'Sila masukkan username dan password.';

    return;

  }


  button.disabled = true;

  button.textContent =
    '⏳ Sedang log masuk...';


  githubLoginRequest_(
    username,
    password,

    function(result) {

      button.disabled = false;

      button.textContent =
        '🔐 Log Masuk';


      if (
        !result ||
        !result.success ||
        !result.token
      ) {

        message.textContent =
          result &&
          result.message
            ? result.message
            : 'Username atau password salah.';

        return;

      }


      // =========================
      // SIMPAN SESSION TOKEN
      // =========================

      localStorage.setItem(
        'survey_token',
        result.token
      );

      // Legacy token — kekalkan
      // untuk keserasian sistem lama.
      localStorage.setItem(
        'BRISK_AUTH_TOKEN',
        result.token
      );


      // =========================
      // REDIRECT KE INDEX.HTML
      // =========================

      const next =
        new URLSearchParams(
          window.location.search
        ).get('next');

      const target =
        next === 'index.html' ||
        next === 'survey.html'
          ? 'index.html'
          : 'index.html';

      window.location.href =
        target +
        '?token=' +
        encodeURIComponent(
          result.token
        );

    },

    function(error) {

      button.disabled = false;

      button.textContent =
        '🔐 Log Masuk';

      console.error(error);

      message.textContent =
        error && error.message
          ? error.message
          : 'Ralat sistem. Sila cuba lagi.';

    }
  );

}


document
  .getElementById('password')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        login();

      }

    }
  );

</script>


</body>

</html>
