<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Database Survey System</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:#f4f6f9;color:#111827}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 10px 35px rgba(15,23,42,.10)}
h1{margin:0 0 6px;font-size:25px}
.subtitle{margin:0 0 24px;color:#64748b;font-size:13px}
label{display:block;margin:0 0 6px;font-size:12px;font-weight:800;color:#475569}
input{width:100%;padding:12px 13px;margin:0 0 15px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.status{min-height:42px;margin-bottom:18px;padding:11px 12px;border-radius:10px;background:#eef2ff;color:#3730a3;font-size:13px}
.status.error{background:#fee2e2;color:#991b1b}.status.success{background:#dcfce7;color:#166534}
.footer{margin-top:18px;text-align:center;color:#94a3b8;font-size:11px}
</style>
</head>
<body>
<div class="login-card">
<h1>🗳️ Database Survey System</h1>
<p class="subtitle">Log masuk untuk mengakses Survey Pemilih</p>
<div id="status" class="status">Sila masukkan maklumat login.</div>
<label for="username">Username</label>
<input id="username" autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginButton" onclick="login()">Log Masuk</button>
<div class="footer">Survey Pemilih • GitHub Pages + Google Apps Script</div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycby6Df6Wh78LVAXLMp-lzOk7S0794xSWtr1_YJMjB8L76yFsgePs35-tBcJt8RVYAwNY/exec';
function api(action,params={}){
  return new Promise((resolve,reject)=>{
    const callback='loginApi_'+Date.now()+'_'+Math.floor(Math.random()*10000);
    const script=document.createElement('script');
    const query=new URLSearchParams({action,callback,...params});
    window[callback]=function(data){delete window[callback];script.remove();resolve(data)};
    script.onerror=function(){delete window[callback];script.remove();reject(new Error('Gagal menghubungi Apps Script API.'))};
    script.src=API_URL+'?'+query.toString();
    document.body.appendChild(script);
  });
}
function setStatus(message,type=''){const el=document.getElementById('status');el.textContent=message;el.className='status '+type}
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const button=document.getElementById('loginButton');
  if(!username||!password){setStatus('Username dan password diperlukan.','error');return}
  button.disabled=true;setStatus('Sedang log masuk...');
  try{
    const result=await api('login',{username,password});
    if(!result||!result.success){setStatus((result&&result.message)||'Login gagal.','error');button.disabled=false;return}
    localStorage.setItem('survey_token',result.token||'');
    localStorage.removeItem('BRISK_AUTH_TOKEN');
    setStatus('Login berjaya. Membuka Survey...','success');
    const next=new URLSearchParams(window.location.search).get('next')||'survey.html';
    const safeNext=/^[A-Za-z0-9._/-]+\.html$/.test(next)?next:'survey.html';
    setTimeout(()=>window.location.replace(safeNext),250);
  }catch(error){setStatus(error.message||'Gagal login.','error');button.disabled=false}
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(function restore(){
  const token=localStorage.getItem('survey_token')||'';
  if(!token)return;
  api('session',{token}).then(result=>{
    if(result&&result.loggedIn){
      const next=new URLSearchParams(window.location.search).get('next')||'survey.html';
      const safeNext=/^[A-Za-z0-9._/-]+\.html$/.test(next)?next:'survey.html';
      window.location.replace(safeNext);
    }
  }).catch(()=>{});
})();
</script>
</body>
</html>
